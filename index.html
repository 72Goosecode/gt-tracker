<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growtopia Farming Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #00ff66;
            padding: 15px;
            max-width: 900px;
            margin: auto;
        }
        h2 { text-align: center; color: #fff; margin-bottom: 15px; }
        .tab-buttons, .view-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn, .view-btn {
            flex: 1; padding: 10px; background: #222; color: #fff;
            border: 1px solid #444; cursor: pointer; font-weight: bold; font-family: inherit;
        }
        .tab-btn.active, .view-btn.active { background: #00ff66; color: #000; }
        .container-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media (max-width: 600px) { .container-grid { grid-template-columns: 1fr; } }
        .container-list { display: flex; flex-direction: column; gap: 15px; }
        .card {
            background: #1a1a1a; border: 1px solid #333; padding: 12px;
            white-space: pre-wrap; line-height: 1.4; border-radius: 4px;
        }
        .status-ready { color: #00ff66; font-weight: bold; }
        .status-not-ready { color: #ff3333; font-weight: bold; }
        .add-form, .config-form {
            background: #222; padding: 15px; border: 1px solid #444;
            margin-bottom: 20px; border-radius: 4px;
        }
        .add-form input, .config-form input {
            background: #111; border: 1px solid #555; color: #fff;
            padding: 8px; margin: 4px 0; width: 100%; font-family: inherit;
        }
        .add-form button, .action-btn, .config-form button {
            background: #00ff66; color: #000; border: none; padding: 8px 12px;
            cursor: pointer; font-weight: bold; font-family: inherit; margin-top: 8px; border-radius: 2px;
        }
        .action-btn.del { background: #ff3333; color: #fff; margin-left: 5px; }
        .sync-status { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>GROWTOPIA FARMING TRACKER</h2>

    <!-- Form Pengaturan Google Script URL -->
    <div class="config-form">
        <strong style="color:#fff;">⚙️ KONEKSI GOOGLE DRIVE (SHEETS)</strong><br>
        <input type="text" id="scriptUrlInput" placeholder="Masukkan URL Google Apps Script kamu di sini">
        <button onclick="saveScriptUrl()">Simpan URL Script</button>
        <div id="syncStatus" class="sync-status" style="margin-top: 8px;">Status: Belum Terhubung</div>
    </div>

    <!-- Form Tambah Timer -->
    <div class="add-form">
        <strong style="color:#fff;">+ TAMBAH WORLD BARU</strong><br>
        <input type="text" id="worldName" placeholder="Nama World (misal: FISH TANK)">
        <div style="display: flex; gap: 5px;">
            <input type="number" id="days" placeholder="Hari" min="0">
            <input type="number" id="hours" placeholder="Jam" min="0" max="23">
            <input type="number" id="minutes" placeholder="Menit" min="0" max="59">
        </div>
        <button onclick="addTimer()">Mulai Timer</button>
    </div>

    <!-- Tombol Mode Tampilan -->
    <div class="view-buttons">
        <button class="view-btn active" id="btnViewList" onclick="switchView('list')">Tampilan List</button>
        <button class="view-btn" id="btnViewGrid" onclick="switchView('grid')">Tampilan Grid</button>
    </div>

    <!-- Tombol Navigasi Tab -->
    <div class="tab-buttons">
        <button class="tab-btn active" id="btnOngoing" onclick="switchTab('ongoing')">ONGOING (<span id="countOngoing">0</span>)</button>
        <button class="tab-btn" id="btnComplete" onclick="switchTab('complete')">COMPLETE (<span id="countComplete">0</span>)</button>
    </div>

    <div id="timerContainer" class="container-list"></div>

    <script>
        let currentTab = 'ongoing';
        let currentView = 'list';
        let localTimers = [];

        // Minta Izin Notifikasi Browser
        if ("Notification" in window) {
            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function triggerBrowserNotification(worldName) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("GROWTOPIA FARMING TRACKER", {
                    body: `World ${worldName} sudah READY untuk di-farm!`,
                    icon: "https://file.gt.world/logo.png" // ikon opsional
                });
            }
        }

        function getScriptUrl() {
            return localStorage.getItem('gt_script_url') || '';
        }

        function saveScriptUrl() {
            const url = document.getElementById('scriptUrlInput').value.trim();
            localStorage.setItem('gt_script_url', url);
            alert("URL Script berhasil disimpan!");
            loadFromCloud();
        }

        async function loadFromCloud() {
            const scriptUrl = getScriptUrl();
            if (!scriptUrl) {
                document.getElementById('syncStatus').innerText = "⚠️ Masukkan URL Apps Script untuk sinkronisasi cloud!";
                localTimers = JSON.parse(localStorage.getItem('gt_local_fallback')) || [];
                render();
                return;
            }

            try {
                document.getElementById('syncStatus').innerText = "🔄 Memuat dari Google Drive...";
                const res = await fetch(scriptUrl);
                const data = await res.json();
                localTimers = data;
                document.getElementById('syncStatus').innerText = "✅ Tersambung & tersinkronisasi dengan Google Drive";
                render();
            } catch (err) {
                console.error(err);
                document.getElementById('syncStatus').innerText = "❌ Gagal memuat data cloud. Menampilkan data lokal.";
                localTimers = JSON.parse(localStorage.getItem('gt_local_fallback')) || [];
                render();
            }
        }

        async function syncToCloud() {
            localStorage.setItem('gt_local_fallback', JSON.stringify(localTimers));
            const scriptUrl = getScriptUrl();
            if (!scriptUrl) return;

            document.getElementById('syncStatus').innerText = "🔄 Menyimpan ke Google Drive...";
            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(localTimers)
                });
                document.getElementById('syncStatus').innerText = "✅ Tersimpan di Google Drive";
            } catch (err) {
                console.error(err);
                document.getElementById('syncStatus').innerText = "❌ Gagal menyimpan ke cloud";
            }
        }

        function addTimer() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            const name = document.getElementById('worldName').value.trim();
            const days = parseInt(document.getElementById('days').value) || 0;
            const hours = parseInt(document.getElementById('hours').value) || 0;
            const mins = parseInt(document.getElementById('minutes').value) || 0;

            if (!name) { alert("Isi nama world dulu!"); return; }
            if (days === 0 && hours === 0 && mins === 0) { alert("Masukkan durasi waktu!"); return; }

            const now = new Date();
            const target = new Date(now.getTime() + (days * 86400000) + (hours * 3600000) + (mins * 60000));

            localTimers.push({
                id: Date.now(),
                name: name,
                targetTime: target.getTime(),
                statusTab: 'ongoing',
                notified: false
            });

            document.getElementById('worldName').value = '';
            document.getElementById('days').value = '';
            document.getElementById('hours').value = '';
            document.getElementById('minutes').value = '';

            render();
            syncToCloud();
        }

        function moveTab(id, newTab) {
            const item = localTimers.find(t => t.id === id);
            if (item) {
                item.statusTab = newTab;
                render();
                syncToCloud();
            }
        }

        function deleteTimer(id) {
            localTimers = localTimers.filter(t => t.id !== id);
            render();
            syncToCloud();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btnOngoing').classList.toggle('active', tab === 'ongoing');
            document.getElementById('btnComplete').classList.toggle('active', tab === 'complete');
            render();
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('btnViewList').classList.toggle('active', view === 'list');
            document.getElementById('btnViewGrid').classList.toggle('active', view === 'grid');
            
            const container = document.getElementById('timerContainer');
            container.className = view === 'grid' ? 'container-grid' : 'container-list';
            render();
        }

        function formatDate(timestamp) {
            const d = new Date(timestamp);
            const daysArr = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const dayName = daysArr[d.getDay()];
            const dateStr = d.toLocaleDateString('id-ID');
            const timeStr = d.toTimeString().split(' ')[0];
            return `Hari ${dayName}, Tanggal ${dateStr}, Pukul ${timeStr}`;
        }

        function render() {
            const container = document.getElementById('timerContainer');
            container.innerHTML = '';

            const ongoingList = localTimers.filter(t => t.statusTab === 'ongoing');
            const completeList = localTimers.filter(t => t.statusTab === 'complete');

            document.getElementById('countOngoing').innerText = ongoingList.length;
            document.getElementById('countComplete').innerText = completeList.length;

            let targetList = currentTab === 'ongoing' ? ongoingList : completeList;
            targetList.sort((a, b) => a.targetTime - b.targetTime);

            if (targetList.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; grid-column: 1/-1;">Tidak ada timer di tab ini.</p>';
                return;
            }

            const now = new Date().getTime();

            targetList.forEach(item => {
                const diff = item.targetTime - now;
                const isReady = diff <= 0;

                // Kirim notifikasi jika timer selesai dan belum pernah diberitahukan
                if (isReady && !item.notified) {
                    item.notified = true;
                    triggerBrowserNotification(item.name);
                    syncToCloud();
                }

                let timerStr = "0d, 0h, 0m, 0s";
                if (!isReady) {
                    const d = Math.floor(diff / 86400000);
                    const h = Math.floor((diff % 86400000) / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    timerStr = `${d}d, ${h}h, ${m}m, ${s}s`;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `==============================
Nama World      : ${item.name}
Timer           : ${isReady ? 'Selesai!' : timerStr}
Estimasi selesai: ${formatDate(item.targetTime)}
Status          : <span class="${isReady ? 'status-ready' : 'status-not-ready'}">${isReady ? 'Ready' : 'Not Ready'}</span>
==============================
<button class="action-btn" onclick="moveTab(${item.id}, '${currentTab === 'ongoing' ? 'complete' : 'ongoing'}')">
    ${currentTab === 'ongoing' ? 'Pindahkan ke Complete' : 'Kembalikan ke Ongoing'}
</button>
<button class="action-btn del" onclick="deleteTimer(${item.id})">Hapus</button>`;

                container.appendChild(card);
            });
        }

        const savedUrl = getScriptUrl();
        if (savedUrl) {
            document.getElementById('scriptUrlInput').value = savedUrl;
        }

        loadFromCloud();
        setInterval(render, 1000);
    </script>
</body>
</html>
